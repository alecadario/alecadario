<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Brief recibido! | Ale Cadario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0D0D0D; color: white;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .inner { max-width: 520px; }
    .check { font-size: 48px; margin-bottom: 24px; }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 5vw, 42px); font-weight: 900;
      line-height: 1.1; margin-bottom: 16px;
    }
    h1 em { font-style: italic; color: #14B8A6; }
    p { font-size: 16px; color: rgba(255,255,255,0.55); line-height: 1.7; margin-bottom: 36px; }
    a {
      display: inline-flex; align-items: center; gap: 8px;
      background: #0D9488; color: white;
      padding: 13px 28px; border-radius: 10px;
      font-size: 15px; font-weight: 700; text-decoration: none;
      transition: background 0.2s;
    }
    a:hover { background: #14B8A6; }
  </style>
</head>
<body>
  <div class="inner">
    <div class="check">✓</div>
    <h1>¡Brief recibido!<br><em>Gracias.</em></h1>
    <p>Lo leo con atención y te escribo en los próximos 2 días. Mientras tanto, podés seguir viendo mi contenido en TikTok.</p>
    <a href="/">← Volver al inicio</a>
  </div>
</body>
</html>
