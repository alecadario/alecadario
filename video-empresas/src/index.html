<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Video empresas · previsualización de trabajo</title>
<style>
  /* Fuentes Pizarra (SIL OFL, ver ../assets/fonts/OFL.txt) */
  @font-face{font-family:"Caveat Brush";src:url(../assets/fonts/caveat-brush-400.woff2) format("woff2");font-weight:400}
  @font-face{font-family:"Caveat";src:url(../assets/fonts/caveat-600.woff2) format("woff2");font-weight:600}
  @font-face{font-family:"Nunito Sans";src:url(../assets/fonts/nunito-sans-400.woff2) format("woff2");font-weight:400}
  @font-face{font-family:"Nunito Sans";src:url(../assets/fonts/nunito-sans-700.woff2) format("woff2");font-weight:700}
  @font-face{font-family:"Nunito Sans";src:url(../assets/fonts/nunito-sans-800.woff2) format("woff2");font-weight:800}
  html,body{margin:0;background:#111;height:100%;overflow:hidden;font-family:"Nunito Sans",sans-serif}
  svg{display:block;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;margin:0 auto}
  body.exportar svg{width:1920px;height:1080px;max-width:none;max-height:none;margin:0}
  #controles{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:center;padding:10px 16px;background:#000a;color:#F4F1EA;font-size:14px}
  body.exportar #controles{display:none}
  #controles input{flex:1}
  #controles button{font:700 14px "Nunito Sans",sans-serif;padding:6px 14px;border-radius:7px;border:0;background:#F4F1EA;color:#173A40;cursor:pointer}
</style>
</head>
<body>
<svg id="escena" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="controles"><button id="play">Reproducir</button><input id="barra" type="range" min="0" step="0.01" value="0"><span id="reloj">0.00 s</span></div>
<script src="motor.js"></script>
<script src="subtitulos.js"></script>
<script src="escenas-1-2.js"></script>
<script>
  // Previsualización de trabajo. El entregable es el MP4 que genera ../render.mjs.
  const barra = document.getElementById('barra'), reloj = document.getElementById('reloj'), boton = document.getElementById('play');
  if (new URLSearchParams(location.search).has('exportar')) document.body.classList.add('exportar');
  barra.max = window.DURACION;
  let t = 0, andando = false, previo = 0;
  function pinta() { window.renderAt(t); barra.value = t; reloj.textContent = t.toFixed(2) + ' s'; }
  function paso(ahora) {
    if (!andando) return;
    t += (ahora - previo) / 1000; previo = ahora;
    if (t >= window.DURACION) { t = window.DURACION; andando = false; boton.textContent = 'Reproducir'; }
    pinta(); requestAnimationFrame(paso);
  }
  boton.onclick = () => {
    andando = !andando; boton.textContent = andando ? 'Pausa' : 'Reproducir';
    if (andando) { if (t >= window.DURACION) t = 0; previo = performance.now(); requestAnimationFrame(paso); }
  };
  barra.oninput = () => { t = +barra.value; pinta(); };
  window.listo = Promise.all(['400 40px "Caveat Brush"', '600 40px "Caveat"', '400 40px "Nunito Sans"', '700 40px "Nunito Sans"', '800 40px "Nunito Sans"']
    .map((f) => document.fonts.load(f))).then(() => { pinta(); return true; });
</script>
</body>
</html>
